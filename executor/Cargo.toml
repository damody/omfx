
[package]
name = "executor"
version = "0.1.0"
edition = "2021"

[dependencies]
fyrox = { workspace = true }
omfx = { path = "../game", optional = true }
omoba-core = { path = "../../omoba-core", default-features = false }
log = "0.4"
simplelog = "0.12"
tracing = "0.1"
tracing-perfetto = "0.1.5"
tracing-subscriber = "0.3"

[features]
default = ["omfx"]
dylib = ["fyrox/dylib"]
runtime-lua-content = ["omfx/runtime-lua-content"]
