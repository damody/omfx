
[package]
name = "omfx"
version = "0.1.0"
edition = "2021"

[dependencies]
fyrox = {workspace = true}
log = "0.4"
tracing = "0.1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
uuid = { version = "1", features = ["v4"] }
omoba-core = { path = "../../omoba-core", features = ["kcp"] }
crossbeam-channel = "0.5"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.0", features = ["rt-multi-thread"] }

specs = { path = "../../specs", features = ["derive", "serde"] }
omoba-sim = { path = "../../omoba-sim", features = ["abi-stable"] }
# 階段 2.1：TowerPlace UI 處理程序轉換選定的塔類型名稱
# （“td_template_order”條目如“tower_dart”）到原型“tower_kind_id”
# u32 通過 `omoba_template_ids::tower_by_name`。
omoba-template-ids = { path = "../../omoba-template-ids" }
failure = "0.1.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
omoba-core = { path = "../../omoba-core", default-features = false, features = ["game-proto"] }
prost = "0.13"
js-sys = "0.3"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "CloseEvent",
    "Document",
    "Element",
    "ErrorEvent",
    "Event",
    "Location",
    "MessageEvent",
    "Response",
    "UrlSearchParams",
    "WebSocket",
    "Window",
    "console",
] }

[features]
default = ["fyrox/default"]
dylib-engine = ["fyrox/dylib"]
runtime-lua-content = ["omoba-core/runtime-lua-content", "omoba-template-ids/runtime-lua-content"]
